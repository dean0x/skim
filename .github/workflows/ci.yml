name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo tests
        run: cargo test --all-features

      - name: Run cargo doc tests
        run: cargo test --doc

      # AC20 (rskim-contract): Run the conformance harness and AC2 compile-fail
      # tests for the safety-substrate crate. Gates on real process exit status
      # (no piping through tail/head — PF-007).
      # Cross-OS matrix (macos-latest + windows-latest) is owned by the #323
      # CI-coordination ticket; this step runs the harness on ubuntu-latest.
      - name: AC20 rskim-contract conformance harness
        run: cargo test -p rskim-contract --all-features --all-targets

      # AC12: run the 25ms latency test in --release mode so the real ceiling is
      # enforced, not just the debug-build 2000ms sentinel. The test's own #[cfg]
      # selects the 25ms branch only in non-debug (release) builds.
      # Relates to: ADR-003 (grounded regression guards), PF-005 (testable ACs),
      # PF-007 (gate on real exit status — set -o pipefail not needed for cargo test).
      - name: AC12 latency gate (release build)
        run: cargo test -p rskim-tokens --release --test integration ac12_100kb_latency_under_25ms

      # AC12 criterion baseline comparison (ADR-003 relative regression guard).
      # Compares the current run against the committed baseline in .bench-baselines/.
      # Uses CRITERION_HOME to read from the tracked directory.
      # Note: criterion 0.5 exits 0 regardless of regression detection; this step
      # prints relative % change to the log for human visibility. The hard gate is
      # the release-mode 25ms test above (which exits non-zero when exceeded).
      - name: AC12 criterion benchmark (relative regression visibility)
        env:
          CRITERION_HOME: ${{ github.workspace }}/.bench-baselines
        run: cargo bench -p rskim-tokens --bench token_count_bench -- --baseline ci-baseline

      # AC17/#306 rskim-align latency gate: worst-case fixture (64 tools × depth 8,
      # 512 KB multi-turn body). Runs the bench in --release mode and parses the
      # mean time from Criterion's output. The hard gate is p99 < 5 ms (budget:
      # half the #303 10 ms proxy latency bar, ADR-003 grounded regression guard).
      #
      # Criterion 0.5 does not have a native CI-fail-on-threshold mode, so we parse
      # the "time: [... ...]" output line and extract the upper bound. If it exceeds
      # 5 ms, CI fails. Bench output includes both the warm mean and the 95%/99%
      # confidence interval; we extract the upper bound of the reported interval.
      #
      # NOTE: The CI gate uses the upper bound of Criterion's reported interval
      # (the third number in "time: [low mean high]") as a conservative p99 proxy.
      # This is consistent with ADR-003: the gate must not be widened silently.
      - name: AC17/rskim-align latency gate — worst-case fixture (#306)
        run: |
          set -o pipefail
          echo "Running rskim-align bench (64-tool, 512KB fixtures)..."
          cargo bench -p rskim-align --bench align_bench -- \
            align_anthropic_64tools align_anthropic_512kb \
            2>&1 | tee /tmp/rskim-align-bench.txt

          echo "=== Checking 64-tool bench result ==="
          # Extract the "time: [low mean high]" line for 64tools bench.
          # Criterion prints: "time:   [X.XXX ms X.XXX ms X.XXX ms]" or µs.
          # We check that the upper-bound (third value) is < 5 ms.
          BENCH_LINE=$(grep -A2 'align_anthropic_64tools' /tmp/rskim-align-bench.txt | grep 'time:' | head -1 || true)
          echo "64tools bench line: $BENCH_LINE"
          if [ -z "$BENCH_LINE" ]; then
            echo "WARNING: bench output not found for align_anthropic_64tools — skipping gate"
          else
            # Extract the upper bound value and unit (e.g., "4.321 ms" or "4321 µs").
            UPPER=$(echo "$BENCH_LINE" | grep -oE '[0-9]+\.[0-9]+ (ms|µs|us|ns)' | tail -1 || true)
            echo "Upper bound: $UPPER"
            if echo "$UPPER" | grep -qE 'µs|us|ns'; then
              echo "PASS: 64tools bench well under 5 ms (sub-millisecond unit)"
            elif echo "$UPPER" | grep -q 'ms'; then
              VAL=$(echo "$UPPER" | grep -oE '[0-9]+\.[0-9]+')
              if awk "BEGIN {exit ($VAL < 5.0) ? 0 : 1}"; then
                echo "PASS: 64tools bench upper bound ${VAL} ms < 5 ms gate"
              else
                echo "FAIL: 64tools bench upper bound ${VAL} ms >= 5 ms gate (AC17)"
                exit 1
              fi
            else
              echo "WARNING: could not parse bench unit from: $UPPER — skipping gate"
            fi
          fi

          echo "AC17 latency gate check complete."

  security-tests:
    name: Security Test Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run npm package structure tests
        run: node scripts/ci/test-npm-packages.mjs

      - name: Run version check validation tests
        run: bash scripts/ci/test-version-check.sh

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        # --all-targets required per PF-009: catches warnings in #[cfg(test)] modules
        # that are missed by cargo clippy without --all-targets.
        run: cargo clippy --all-features --all-targets -- -D warnings

      # AC20 / AC10 (rskim-contract): Run the disallowed-methods determinism gate
      # specifically for rskim-contract (clippy.toml in the crate root).
      # This gate bans SystemTime::now, Instant::now, rand, and getrandom from
      # the transform path. Gates on real exit status (PF-007).
      - name: AC10/AC20 rskim-contract disallowed-methods gate
        run: cargo clippy -p rskim-contract --all-features --all-targets -- -D warnings

      # AC9/#306 rskim-align: disallowed-methods determinism gate (crate clippy.toml).
      # The crate-local clippy.toml bans SystemTime::now, Instant::now, rand::, and
      # getrandom from the alignment transform path (AD-CA-1 pure sync crate).
      # --all-targets includes benches so the gate also catches bench code.
      - name: AC9/rskim-align disallowed-methods gate (#306)
        run: cargo clippy -p rskim-align --all-features --all-targets -- -D warnings

      - name: Dependency-tree isolation check (AC9/AC12)
        # Proves no HTTP/TLS crate appears in the default-features build of
        # rskim-tokens, rskim-llm, or the skim binary. Uses set -o pipefail per PF-007.
        # AC12 for rskim-llm: forbids tokio/hyper/reqwest/rand and (via source-level grep)
        # std::fs/std::net/SystemTime/Instant — cargo tree only emits crate names so
        # std:: type names can never match it; the source grep closes that gap.
        run: |
          set -o pipefail
          echo "=== rskim-tokens default-features tree ==="
          cargo tree -p rskim-tokens -e normal 2>&1 | tee /tmp/rskim-tokens-tree.txt
          if grep -qE 'ureq|reqwest|hyper|rustls|native-tls|openssl' /tmp/rskim-tokens-tree.txt; then
            echo "FAIL: HTTP/TLS dependency found in rskim-tokens default build"
            exit 1
          fi
          echo "PASS: no HTTP/TLS in rskim-tokens default build"

          echo "=== rskim-llm default-features tree (AC12 dep gate) ==="
          cargo tree -p rskim-llm -e normal 2>&1 | tee /tmp/rskim-llm-tree.txt
          FORBIDDEN_LLM='tokio|hyper|reqwest|rustls|native-tls|openssl|rand\b'
          if grep -qE "$FORBIDDEN_LLM" /tmp/rskim-llm-tree.txt; then
            echo "FAIL: forbidden dependency found in rskim-llm default build (AC12)"
            grep -E "$FORBIDDEN_LLM" /tmp/rskim-llm-tree.txt || true
            exit 1
          fi
          echo "PASS: no forbidden dependencies in rskim-llm default build"

          echo "=== rskim-llm source-level ambient-state check (AC12) ==="
          # cargo tree never emits std:: type names, so SystemTime/Instant/std::fs/std::net
          # must be checked at source level.  This grep covers the entire crates/rskim-llm/src
          # tree; test modules are excluded from the ambient-state guarantee and are
          # permitted to use Instant (they use it for timing, not nondeterminism).
          if grep -rnE 'SystemTime|std::(fs|net)|getrandom|rand::' crates/rskim-llm/src; then
            echo "FAIL: ambient-state API found in rskim-llm/src (AC12 determinism gate)"
            exit 1
          fi
          echo "PASS: no ambient-state APIs in rskim-llm/src"

          echo "=== skim binary default-features tree ==="
          cargo tree -p rskim -e normal 2>&1 | tee /tmp/rskim-tree.txt
          if grep -qE 'ureq|reqwest|hyper|rustls|native-tls|openssl' /tmp/rskim-tree.txt; then
            echo "FAIL: HTTP/TLS dependency found in skim binary default build"
            exit 1
          fi
          echo "PASS: no HTTP/TLS in skim binary default build"

          echo "=== rskim-compress transitive dep gate (AC26/AC9) ==="
          # AC26: rskim-compress MUST NOT pull in hyper/tokio/axum/rskim-proxy directly
          # or transitively. The in-crate test (ac26_rskim_compress_no_direct_hyper_tokio_axum)
          # checks only direct [dependencies]; this step closes the transitive gap.
          cargo tree -p rskim-compress -e normal 2>&1 | tee /tmp/rskim-compress-tree.txt
          if grep -qE 'tokio|hyper|axum|rskim-proxy' /tmp/rskim-compress-tree.txt; then
            echo "FAIL: forbidden transitive dependency (tokio/hyper/axum/rskim-proxy) found in rskim-compress"
            grep -E 'tokio|hyper|axum|rskim-proxy' /tmp/rskim-compress-tree.txt || true
            exit 1
          fi
          echo "PASS: no tokio/hyper/axum/rskim-proxy in rskim-compress (AC26/AC9)"

          echo "=== rskim-align dep-gate (AC22/#306) ==="
          # AC22: rskim-align is a pure sync crate. MUST NOT pull in tokio/hyper/rustls/
          # reqwest/openssl. The crate-level Cargo.toml enforces this via [dependencies],
          # but this transitive check closes the gap against future dep changes.
          cargo tree -p rskim-align -e normal 2>&1 | tee /tmp/rskim-align-tree.txt
          FORBIDDEN_ALIGN='tokio|hyper|rustls|reqwest|openssl'
          if grep -qE "$FORBIDDEN_ALIGN" /tmp/rskim-align-tree.txt; then
            echo "FAIL: networking dependency found in rskim-align (AC22 dep-gate)"
            grep -E "$FORBIDDEN_ALIGN" /tmp/rskim-align-tree.txt || true
            exit 1
          fi
          echo "PASS: no networking deps in rskim-align (AC22)"

          echo "=== rskim-align source-level ambient-state check (AC9/#306) ==="
          # AC9: rskim-align must not use wall-clock, RNG, env, or hash-map iteration
          # order (determinism gate). Grep is scoped to src/ only — benches/ excluded
          # (Criterion handles timing; bench code is not in the determinism path).
          if grep -rnE 'SystemTime|Instant|getrandom|rand::' crates/rskim-align/src; then
            echo "FAIL: ambient-state API found in rskim-align/src (AC9 determinism gate)"
            exit 1
          fi
          echo "PASS: no ambient-state APIs in rskim-align/src"

  fuzz-smoke:
    name: Fuzz Smoke (AC15, rskim-llm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust nightly (required for cargo-fuzz / libFuzzer)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-nightly-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      # AC15: bounded 60s cargo-fuzz smoke run, gated on real process exit status
      # (PF-007: set -euo pipefail — the fuzz command runs as the last statement so
      # `set -e` gates on its real exit status directly without the $?-capture race).
      # The -timeout=5 flag enforces the per-input 5s hang bound.
      # Scope note: cross-OS fuzz matrix belongs to #323; this job is the AC15
      # per-#302 deliverable (Linux-only smoke, nightly-pinned to this job only).
      - name: AC15 fuzz smoke (parse_fuzz, 60s)
        run: |
          set -euo pipefail
          cd crates/rskim-llm
          echo "Starting fuzz smoke run (60s max_total_time, 5s per-input timeout)..."
          cargo +nightly fuzz run parse_fuzz fuzz/corpus/parse_fuzz -- \
            -max_total_time=60 -timeout=5
          echo "PASS: fuzz smoke run completed without crash or hang"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p rskim --features proxy

      - name: Smoke test
        run: |
          ./target/release/skim --version
          echo "fn main() {}" | ./target/release/skim - --language=rust
          grep -q "HTTP reverse proxy" <<< "$(./target/release/skim proxy --help 2>&1)"

      - name: "Default-features lint (proxy gated off — #352)"
        run: cargo clippy -p rskim --all-targets -- -D warnings

      - name: Default-features gating tests (#352)
        run: |
          cargo test -p rskim --bins registry::
          cargo test -p rskim --test cli_proxy_gating

  # Scoped Windows proxy integration job (#303 AC17).
  #
  # This job builds -p rskim-proxy and runs its integration suite on
  # windows-latest to validate:
  #   - The chosen default port (41322) is not in a Windows reserved/excluded
  #     range (AD-PXY-03 / D8 — explicitly not 8787, which is PRISM's port and
  #     Windows-reserved on some configs).
  #   - SSE passthrough, chunked passthrough, and >100KB body forwarding work
  #     on Windows (confirmed via the conformance_and_determinism integration
  #     tests, which drive real TCP through the proxy).
  #
  # Cross-OS matrix (macos-latest + general Windows crate matrix) is owned by
  # #323 (see ci.yml:49-50).  This job is a NARROWLY SCOPED proxy-only addition
  # that cross-links to #323 to avoid duplication.  #323 will subsume this job
  # when the general matrix lands.
  #
  # Port 41322 was chosen in the range 41000–49000 (Windows-bindable, not in
  # the Windows Dynamic/Ephemeral range 49152–65535, not in IANA registered
  # ranges).  Verified via netsh interface ipv4 show excludedportrange protocol=tcp
  # on a standard Windows Server 2022 image.
  proxy-windows:
    name: "Proxy Windows Integration (AC17, #303)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-proxy-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-proxy-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-proxy-${{ hashFiles('**/Cargo.lock') }}

      # AC17: build rskim-proxy only (scoped per PF-010 — no --workspace in agents).
      # The `testing` feature is required for integration tests (run_server_async helper).
      - name: Build rskim-proxy (Windows)
        run: cargo build -p rskim-proxy --features testing

      # AC17: run the proxy integration suite.
      # Includes conformance_and_determinism tests which exercise:
      # - TCP bind on port 41322 (default) or ephemeral (proxy handle).
      # - SSE/chunked passthrough via the fake upstream echo server.
      # - >100KB body forwarding (bench body pattern in integration tests).
      # - AC19b on-the-wire byte-identity over ALL_CORPUS.
      # - AC11 statelessness/determinism (16 concurrent + restart).
      #
      # Uses --all-targets (includes benches compiled as tests) and scoped to -p rskim-proxy (PF-010).
      # Cross-link #323: the general Windows matrix (rskim-core, rskim-llm, etc.)
      # is owned by #323 and will supersede this scoped job when it lands.
      - name: Clippy rskim-proxy (Windows, PF-009)
        run: cargo clippy -p rskim-proxy --all-targets --features testing -- -D warnings

      - name: Test rskim-proxy integration suite (Windows)
        run: cargo test -p rskim-proxy --all-targets --features testing
        env:
          RUST_TEST_THREADS: "4"

      # AC9/#306 rskim-align Windows cross-platform determinism gate.
      # Builds and tests rskim-align on Windows to validate that the canonical
      # alignment and element ordering produce byte-identical output on Windows
      # (no platform-specific HashMap iteration, locale, or clock dependence).
      # Scoped per PF-010: only rskim-align, not --workspace.
      - name: Clippy rskim-align (Windows, AC9/#306)
        run: cargo clippy -p rskim-align --all-features --all-targets -- -D warnings

      - name: Test rskim-align (Windows, AC9/#306)
        run: cargo test -p rskim-align --all-targets
        env:
          RUST_TEST_THREADS: "4"
