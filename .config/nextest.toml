# nextest configuration for skim workspace.
#
# slow-timeout: mark tests as SLOW after 120 s; terminate after 30 minutes.
# Rationale: on macOS, subprocess execution under heavy cargo build load
# (e.g., during a full validation run after a cold compile) can delay
# the OS scheduler for serial-annotated tests by 10-15 minutes before they
# resume and pass normally. The most affected test is
# runner::tests::test_node_fallback_local_bin_found (#[serial_test::serial],
# spawns a temp shell script via CommandRunner), which took ~780 s during
# the Gate-1 validation run. A 30-minute hard ceiling converts any truly
# indefinite hang into an explicit timeout failure while allowing the
# known-slow tests to complete.
#
# This file is no-op in CI: the CI workflow uses `cargo test`, not nextest.
[profile.default]
slow-timeout = { period = "120s", terminate-after = 15 }
