[package]
name = "rskim-research"
version = "0.1.0"
edition = "2024"
authors = ["Skim Contributors"]
license = "MIT"
description = "Pinned corpus clones and corpus config loading for the search scoreboard"
repository = "https://github.com/dean0x/skim"
publish = false

[lib]
name = "rskim_research"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
