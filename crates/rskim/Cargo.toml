[package]
name = "rskim"
version = "3.0.0"
edition = "2024"
# MSRV: cmd/search/build_lock.rs uses File::try_lock / TryLockError, stabilized
# in Rust 1.89. Declared so older toolchains get a clear diagnostic, not a
# confusing "method not found" error.
rust-version = "1.89"
authors = ["Skim Contributors"]
license = "MIT"
description = "The most intelligent context optimization engine for coding agents. Code-aware AST parsing, command rewriting, output compression."
repository = "https://github.com/dean0x/skim"
readme = "README.md"

[[bin]]
name = "skim"
path = "src/main.rs"

[dependencies]
rskim-core = { version = "3.0.0", path = "../rskim-core" }
# rskim-compress: hosts compress_log + BlockRouter (R1/R2 per #304).
# AC26: rskim-compress must not add regex to rskim-core.
# The internal crates below publish to crates.io in lockstep with rskim
# (scripts/release-prep.sh bumps every version here with the package version).
rskim-compress = { version = "3.0.0", path = "../rskim-compress" }
# rskim-proxy and rskim-contract: gated behind the `proxy` cargo feature (#352).
# Enabling pulls tokio/hyper/rustls into the tree; default builds are HTTP/TLS-free (AC9).
rskim-contract = { version = "3.0.0", path = "../rskim-contract", optional = true }
rskim-proxy = { version = "3.0.0", path = "../rskim-proxy", optional = true }
# Delegates token counting to the multi-provider library (AC13, AC15).
# Do NOT enable "net-anthropic" here — default build must remain HTTP-free (AC9).
rskim-tokens = { version = "3.0.0", path = "../rskim-tokens" }
clap = { version = "4.5", features = ["derive"] }
anyhow = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
rayon = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
clap_complete = { workspace = true }
memchr = "2.8.0"
regex = { workspace = true }
rusqlite = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
inquire = { workspace = true }
comfy-table = { workspace = true }
crossterm = { workspace = true }
# Required: `rskim_core::Parser::parse()` returns `tree_sitter::Tree`, so the
# CLI needs this dep to work with Tree/Node types in the diff rendering pipeline
# (git.rs: is_container_node, find_changed_node_ranges, render_with_unchanged_context).
tree-sitter = { workspace = true }
quick-xml = { workspace = true }
tempfile = { workspace = true }
crossbeam-channel = { workspace = true }
gix = { workspace = true }
toml = { workspace = true }

[features]
# Non-default gate for the `skim proxy` subcommand (#352). Enabling pulls
# tokio/hyper/rustls into the tree. Default builds have no proxy subcommand
# (AC9: HTTP/TLS-free default tree). Release binaries enable it (release.yml).
proxy = ["dep:rskim-proxy", "dep:rskim-contract"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
filetime = { workspace = true }
rskim-contract = { path = "../rskim-contract" }
# The role oracle of the scoreboard: the agreement test of the search roles
# (cmd/search/roles_tests.rs) reads it. The oracle depends on no rskim crate.
rskim-oracle = { path = "../rskim-oracle" }
