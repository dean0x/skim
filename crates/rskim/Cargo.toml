[package]
name = "rskim"
version = "2.11.0"
edition = "2024"
authors = ["Skim Contributors"]
license = "MIT"
description = "The most intelligent context optimization engine for coding agents. Code-aware AST parsing, command rewriting, output compression."
repository = "https://github.com/dean0x/skim"
readme = "README.md"

[[bin]]
name = "skim"
path = "src/main.rs"

[dependencies]
rskim-core = { version = "2.11.0", path = "../rskim-core" }
# rskim-compress: hosts compress_log + BlockRouter (R1/R2 per #304).
# AC26: rskim-compress is publish=false and must not add regex to rskim-core.
rskim-compress = { path = "../rskim-compress" }
# rskim-proxy and rskim-contract: gated behind the `proxy` cargo feature (#352).
# Enabling pulls tokio/hyper/rustls into the tree; default builds are HTTP/TLS-free (AC9).
rskim-contract = { path = "../rskim-contract", optional = true }
rskim-proxy = { path = "../rskim-proxy", optional = true }
# rskim-align: pure sync crate; optional under `proxy` feature so it is only
# linked when the proxy subcommand is built. The crate itself has no hyper/tokio
# deps (AC9 / AD-CA-1); pulling it in here does NOT break ADR-008. The binary
# is the correct link point for both rskim-proxy (async) and rskim-align (sync).
# AD-CA-9: record type + schema migration are unconditional; only the writer
# wiring (ChannelAlignmentRecorder, CacheAlignStage) is proxy-gated.
rskim-align = { path = "../rskim-align", optional = true }
rskim-search = { path = "../rskim-search" }
# Delegates token counting to the multi-provider library (AC13, AC15).
# Do NOT enable "net-anthropic" here — default build must remain HTTP-free (AC9).
rskim-tokens = { path = "../rskim-tokens" }
clap = { version = "4.5", features = ["derive"] }
anyhow = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
rayon = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
clap_complete = { workspace = true }
strip-ansi-escapes = { workspace = true }
memchr = "2.8.0"
regex = { workspace = true }
rusqlite = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
inquire = { workspace = true }
comfy-table = { workspace = true }
crossterm = { workspace = true }
# Required: `rskim_core::Parser::parse()` returns `tree_sitter::Tree`, so the
# CLI needs this dep to work with Tree/Node types in the diff rendering pipeline
# (git.rs: is_container_node, find_changed_node_ranges, render_with_unchanged_context).
tree-sitter = { workspace = true }
quick-xml = { workspace = true }
tempfile = { workspace = true }
crossbeam-channel = { workspace = true }
toml = { workspace = true }

[features]
# Non-default gate for the `skim proxy` subcommand (#352). Enabling pulls
# tokio/hyper/rustls into the tree. Default builds have no proxy subcommand
# (AC9: HTTP/TLS-free default tree). Release binaries enable it (release.yml).
proxy = ["dep:rskim-proxy", "dep:rskim-contract", "dep:rskim-align"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
filetime = { workspace = true }
rskim-contract = { path = "../rskim-contract" }
# proxy_analytics tests construct Bytes values for ProxyEvent::new (feature = "proxy" only).
bytes = { workspace = true }
# AC23 / AC15 proxy server E2E tests: rskim_proxy::testing::run_server_with_listener
# (feature = "proxy" only — the test module is gated by #[cfg(feature = "proxy")]).
rskim-proxy = { path = "../rskim-proxy", features = ["testing"] }
# Tokio runtime + TcpListener/TcpStream for async proxy server tests.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util"] }
