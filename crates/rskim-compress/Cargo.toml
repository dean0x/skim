[package]
name = "rskim-compress"
version = "3.0.0"
edition = "2024"
authors = ["Skim Contributors"]
license = "MIT"
description = "Per-content-type block compression router for skim Layer-3 (BlockRouter, log compression)"
repository = "https://github.com/dean0x/skim"
# Published to crates.io in lockstep with `rskim`, which depends on it.
# scripts/release-prep.sh bumps this version with the others.

[dependencies]
rskim-contract = { version = "3.0.0", path = "../rskim-contract" }
rskim-llm = { version = "3.0.0", path = "../rskim-llm" }
regex = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rskim-contract = { path = "../rskim-contract", features = ["harness"] }
proptest = { workspace = true }
criterion = { workspace = true }

[lints.clippy]
# Enforce strict error handling in non-test code (matching rskim-contract pattern).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[lib]
name = "rskim_compress"
path = "src/lib.rs"

[[bench]]
name = "engine_bench"
harness = false
