[package]
name = "rskim-llm"
version = "2.11.0"
edition = "2024"
authors = ["Skim Contributors"]
license = "MIT"
description = "LLM message model: parse/serialize Anthropic & OpenAI request bodies with content-block classification"
repository = "https://github.com/dean0x/skim"
# Published to crates.io in lockstep with `rskim`, which depends on it.
# scripts/release-prep.sh bumps this version with the others.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[lib]
name = "rskim_llm"
path = "src/lib.rs"

[[bench]]
name = "parse_bench"
harness = false
