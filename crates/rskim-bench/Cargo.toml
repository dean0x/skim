[package]
name = "rskim-bench"
version = "0.1.0"
edition = "2024"
authors = ["Skim Contributors"]
license = "MIT"
description = "Search scoreboard: the end-to-end quality gate for skim search"
repository = "https://github.com/dean0x/skim"
publish = false

[[bin]]
name = "scoreboard"
path = "src/bin/scoreboard.rs"

[lib]
name = "rskim_bench"
path = "src/lib.rs"

[dependencies]
rskim-research = { path = "../rskim-research" }
rskim-oracle = { path = "../rskim-oracle" }
anyhow = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[features]
## Expose the scoreboard test helpers (`scoreboard::test_support` and the
## corpus fixtures) to integration tests. Not included in production builds by
## default.
test-utils = []

[dev-dependencies]
# Enable test-utils so integration tests in tests/ can import the scoreboard
# test helpers.
rskim-bench = { path = ".", features = ["test-utils"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
