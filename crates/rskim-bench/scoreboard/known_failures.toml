# --- #546: --ast named patterns match more than their names promise ------------------------
# try-catch-finally declares two independent bigrams, try_statement -> catch_clause
# and try_statement -> finally_clause (patterns.rs:288-301), and the verify gate
# accepts a file where ANY one declared edge is real (compound/reparse.rs:139-230).
# The structural oracle (#541) requires ONE try_statement carrying both clauses.
# The golden entry is a false-positive guard (expect_oracle_empty): when #546 is
# fixed this XPASSes; remove this entry, keep the golden entry, and re-bless.

[[xfail]]
issue = "#546"
check = "structural.precision"
ids = ["skim-ast-try-catch-finally-javascript"]
note = "npm/rskim/scripts/postinstall.js: try{}finally{} (:233/:271) wraps a separate try{}catch{} (:273/:275); no try has both clauses"

# --- #571: .tsx is parsed with the TypeScript grammar -------------------------------------
# Language::from_extension("tsx") is TypeScript and Language::to_tree_sitter()
# maps it to LANGUAGE_TYPESCRIPT (both in crates/rskim-core/src/types.rs), so
# the AST index and the verify gate never see the TSX grammar. JSX breaks that
# tree: in _og.tsx the root is an ERROR node and no try_statement, catch_clause
# or expression_statement exists. The structural oracle (#541) parses .tsx with
# the TSX grammar (SEARCH-ADR-007 (independent ground-truth oracle), #571).

[[xfail]]
issue = "#571"
check = "structural.recall"
ids = ["zod-ast-try-catch-tsx", "zod-ast-unhandled-result-tsx"]
note = "packages/docs/pages/api/_og.tsx: TSX try_statement :33, catch_clause :119, expression_statement :120; the TS parse is ERROR from the root"

# --- #572: empty-function counts a `{ self }` body as empty ------------------------------
# is_counted_child (ast_index/structural.rs:481-483) drops every kind in
# PUNCTUATION_KIND_IDS, which includes the named `self` expression
# (structural.rs:295), so a body whose only child is the tail expression `self`
# counts 0 children and emits EMPTY_BODY (extract.rs:850-880). The oracle counts
# named, non-extra children, as "a function item with an empty body" says.

[[xfail]]
issue = "#572"
check = "structural.precision"
ids = ["ripgrep-ast-empty-function-rust"]
note = "crates/globset/src/glob.rs:84 `fn as_ref(&self) -> &Glob { self }` and crates/pcre2/src/matcher.rs:245 `{ self }` bodies"

# --- New frozen-answer checks: refs, clash, stakes, the text universe and the definition anchor ---
