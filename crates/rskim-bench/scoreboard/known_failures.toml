# Known HARD failures of the search scoreboard (#203), each ledgered against a
# filed ticket. A ledgered failure is XFAIL (the gate passes). A ledgered
# (check, id) that PASSES is XPASS, which fails the gate: fix landed, so
# remove its id from this file ("promote").
#
# Seeded from the first real run at skim b8a0a79 (2026-09-25), with the
# exact failing ids copied from report.json. Every entry was classified
# against the ticket's root cause, and the files the pages never show were
# checked against raw bytes (`git grep -F`). Ids are assigned to a corpus by
# their `<corpus>-` prefix.
#
# A NEW HARD failure is never added here without a filed ticket number.

# --- #544: multi-word pagination ------------------------------------------------------
# The candidate pool is cut to max(5 x limit, 100) + offset BEFORE
# verification, but offset/limit are applied to VERIFIED rows. The tail of the
# list is unreachable, and page boundaries depend on --limit. has_more is ORed
# with the pre-verify "pool was capped" flag, so empty pages claim more.

[[xfail]]
issue = "#544"
check = "pagination.complete"
ids = ["skim-G001", "skim-G004", "zod-G001", "zod-G003"]
note = "query.rs:670-693 pool cut before verification; files never shown on any page"

[[xfail]]
issue = "#544"
check = "pagination.ordered"
ids = ["skim-G001", "skim-G004", "zod-G001", "zod-G003"]
note = "query.rs:670-693 + :1419-1425 skip/take on verified rows; concatenated pages != full list"

[[xfail]]
issue = "#544"
check = "pagination.has_more_honest"
ids = [
    "skim-G001", "skim-G002", "skim-G003", "skim-G004",
    "ripgrep-G001", "ripgrep-G002", "ripgrep-G003",
    "zod-G001", "zod-G002", "zod-G003",
]
note = "query.rs:692 capped = pre-verify count == pool; :1433 ORs it into has_more (empty pages / last page claim more)"

