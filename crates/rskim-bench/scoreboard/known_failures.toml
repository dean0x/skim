# Known HARD failures of the search scoreboard (#203), each ledgered against a
# filed ticket. A ledgered failure is XFAIL (the gate passes). A ledgered
# (check, id) that PASSES is XPASS, which fails the gate: the fix landed, so
# remove its id from this file ("promote").
#
# The ledger has no entries.
#
# A NEW HARD failure is never added here without a filed ticket number. An
# entry looks like this:
#
#   [[xfail]]
#   issue = "#NNN"
#   check = "lexical.recall"
#   ids = ["skim-X01"]
#   note = "the cause, in one line"
#
# Ids are assigned to a corpus by their `<corpus>-` prefix.
