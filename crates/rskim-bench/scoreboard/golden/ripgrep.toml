# --- stakes: a plain-text search judged against the regex oracle ------------------------
# No answer is frozen here. Each entry names a query, its flags and what is compared with
# the oracle: the matching lines, the files, the per-file counts, or the exit code. The
# oracle reads every tracked text file with the rules of rg for -i, -S, -w, -F, -E, -g and
# -t. Exit codes follow rg: 0 a match, 1 no match, 2 a rejected query or flag set.
# Q01 and Q02 read the exit codes of a plain literal. Q04 to Q08 state, as regular
# expressions, the phrase and near queries of the earlier lexical entries. The other
# entries each use one flag: -i, -E, -l, -c, -g, -t, -w, -C and -S.
[[stakes]]
id = "ripgrep-Q01"
query = "qzvx_absent_7713"
flags = []
expect = "exit"
exit = 1

[[stakes]]
id = "ripgrep-Q02"
query = "wsl_prefix"
flags = []
expect = "exit"
exit = 0

[[stakes]]
id = "ripgrep-Q03"
query = 'glob'
flags = ["-F", "-E"]
expect = "exit"
exit = 2

[[stakes]]
id = "ripgrep-Q04"
query = 'line terminator'
