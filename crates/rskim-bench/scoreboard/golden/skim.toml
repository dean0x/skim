# --- concepts: the seed's queries and relevance regexes, verbatim ------------------

[[concept]]
id = "skim-C01"
query = "build lock"
relevant = '(?i)build[_\s-]*lock'

[[concept]]
id = "skim-C02"
query = "temporal staleness check"
relevant = '(?i)temporal[\w\s-]{0,30}stale|stale[\w\s-]{0,30}temporal'

[[concept]]
id = "skim-C03"
query = "elision marker"
relevant = '(?i)elision[_\s-]*marker'

[[concept]]
id = "skim-C04"
query = "force raw marker"
relevant = '(?i)force[_\s-]*raw'

[[concept]]
id = "skim-C05"
query = "credential redaction"
relevant = '(?i)redact'

[[concept]]
id = "skim-C06"
query = "shallow clone"
relevant = '(?i)shallow[_\s-]*(clone|repo|checkout|history)|is_shallow|unshallow'

[[concept]]
id = "skim-C07"
query = "token budget cascade"
relevant = '(?i)(token|budget)[\w\s-]{0,40}cascade|cascade[\w\s-]{0,40}(token|budget)'

